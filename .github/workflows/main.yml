name: Build ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
          df -h /

      - name: Build the ISO inside Debian 13
        run: |
          sudo docker run --rm --privileged -v "$PWD":/kit -w /kit debian:trixie bash -c '
            set -e
            apt-get update
            apt-get install -y ca-certificates
            chmod +x build.sh check-packages.sh tools/*.py
            ./build.sh
          '

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: aurora-os-iso
          path: out/*
          compression-level: 0
          retention-days: 7
