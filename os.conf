# os.conf — identity of your OS. Edit, then re-run: sudo ./build.sh
# Everything in config-src/ that contains @@TOKENS@@ is filled in from here.

OS_NAME="Aurora OS"     # Shown in the installer, menus and ISO metadata
OS_ID="aurora"          # lowercase letters/digits/dashes: file names, hostname, branding id
OS_VERSION="1.0"
LIVE_USER="aurora"      # user of the live session (no password, passwordless sudo)

DEBIAN_MIRROR="http://deb.debian.org/debian/"

# "yes" = try to add VirtualBox guest utilities (clipboard, auto-resize) from
# Debian fasttrack. VirtualBox is not in Debian 13 itself; if fasttrack has no
# trixie packages the build prints a warning and continues without them.
VBOX_GUEST="yes"
