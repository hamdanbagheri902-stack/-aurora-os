# Calamares main config for @@OS_NAME@@.
# "show" = pages the user sees; "exec" = jobs run after clicking Install.
---
modules-search: [ local ]

instances:
- id:       before_bootloader
  module:   shellprocess
  config:   shellprocess_before_bootloader.conf
- id:       cleanup
  module:   shellprocess
  config:   shellprocess_cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@before_bootloader
  - packages
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@cleanup
  - umount
- show:
  - finished

branding: @@OS_ID@@

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
