# GRUB installation. efiBootloaderId MUST stay "debian": Debian's signed GRUB
# (used for Secure Boot) looks for its config in \EFI\debian\. The menu entry
# still shows @@OS_NAME@@ (from branding.desc -> GRUB_DISTRIBUTOR).
---
efiBootLoader:      "grub"
grubInstall:        "grub-install"
grubMkconfig:       "grub-mkconfig"
grubCfg:            "/boot/grub/grub.cfg"
grubProbe:          "grub-probe"
efiBootMgr:         "efibootmgr"
efiBootloaderId:    "debian"
installEFIFallback: false
