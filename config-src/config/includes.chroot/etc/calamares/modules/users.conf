# User page: one admin user (sudo), root account stays locked.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - cdrom
    - floppy
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - sudo

autologinGroup:   autologin
doAutologin:      false
sudoersGroup:     sudo
setRootPassword:  false
doReusePassword:  false

passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords:        true
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root ]

hostname:
    location:       EtcFile
    writeHostsFile: true
    template:       "@@OS_ID@@-${cpu}"
