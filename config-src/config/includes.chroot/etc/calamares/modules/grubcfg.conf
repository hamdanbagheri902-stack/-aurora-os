# Settings written to /etc/default/grub on the installed system.
---
overwrite:          false
keepDistributor:    false
prefer_grub_d:      false
always_use_defaults: false
defaults:
    GRUB_TIMEOUT:          5
    GRUB_DEFAULT:          "0"
    GRUB_DISABLE_SUBMENU:  true
    GRUB_TERMINAL_OUTPUT:  "console"
    GRUB_DISABLE_RECOVERY: false
