# Remove live-session-only packages from the installed system (offline).
---
backend:             apt
skip_if_no_internet: false
update_db:           false
update_system:       false

operations:
    - try_remove:
        - calamares
        - live-boot
        - live-boot-initramfs-tools
        - live-config
        - live-config-systemd
        - live-tools
