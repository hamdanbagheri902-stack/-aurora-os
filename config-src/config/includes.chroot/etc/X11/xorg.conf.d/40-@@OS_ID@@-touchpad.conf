# Touchpad defaults for X11 sessions (SDDM greeter and Plasma on X11).
# Wayland sessions get the same via /usr/lib/@@OS_ID@@-installer/touchpad-tap.
Section "InputClass"
    Identifier      "@@OS_NAME@@ touchpad defaults"
    MatchIsTouchpad "on"
    MatchDriver     "libinput"
    Option          "Tapping" "on"
    Option          "TappingDrag" "on"
    Option          "DisableWhileTyping" "on"
    Option          "NaturalScrolling" "false"
EndSection
